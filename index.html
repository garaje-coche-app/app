function sheetHtml() {
  if (!sheet) return '';
  if (sheet.type === 'refuel') {
    const r = sheet.item;
    return `<form class="sheet" id="sheetForm">
      <span class="k">Repostaje del ${new Date(r.ts).toLocaleDateString('es-ES', { day: 'numeric', month: 'long' })}</span>
      ${r.photo ? `<img id="sPhoto" alt="Foto del surtidor" style="width:100%;max-height:220px;object-fit:cover;border-radius:10px;background:#15181c;min-height:120px">` : ''}
      <label class="btn sec" for="pumpFile" data-pump="${r.ts}">📸 ${r.photo ? 'Cambiar foto del surtidor' : 'Rellenar con foto del surtidor'}</label>
      <label for="sLitres">Litros del tique<input id="sLitres" inputmode="decimal" value="${r.litres != null ? nf(r.litres, 2) : ''}" placeholder="41,00"></label>
      <p class="muted">Pon los litros reales del surtidor: si llenaste el depósito, con ellos se corrige el cálculo de consumo de los trayectos.</p>
      ${r.price_auto ? '<p class="muted">Precio calculado con la gasolinera más cercana. Corrígelo con el del tique si quieres.</p>' : ''}
      <label for="sPrice">Precio total (€)<input id="sPrice" inputmode="decimal" value="${r.price_total != null ? nf(r.price_total, 2) : ''}" placeholder="52,30"></label>
      <label for="sStation">Gasolinera<input id="sStation" value="${esc(r.station || '')}" placeholder="Repsol Centro"></label>
      <div class="btns"><button class="btn sec" type="button" data-close>Cancelar</button><button class="btn" type="submit">Guardar</button></div>
    </form>`;
  }
  if (sheet.type === 'pump') {
    const v = sheet.read || {};
    const target = sheet.ts ? refuels.refuels.find(r => r.ts === sheet.ts) : null;
    return `<form class="sheet" id="sheetForm">
      <span class="k">Foto del surtidor</span>
      <img src="${sheet.img}" alt="Foto del surtidor" style="width:100%;max-height:200px;object-fit:cover;border-radius:10px">
      ${sheet.reading ? '<p class="muted">Leyendo los números… (unos segundos)</p>' : `
      <p class="muted" style="color:${v.ok ? C.ok : C.ac}">${v.ok ? '✓ Leído y cuadra: litros × precio = importe. Revisa y guarda.' : v.error ? esc(v.error) + ' Escríbelos a mano.' : 'No he podido leerlo todo bien: revisa los números antes de guardar.'}</p>
      <div class="g3" style="gap:8px">
        <label for="pTotal">Importe €<input id="pTotal" inputmode="decimal" value="${v.total != null ? nf(v.total, 2) : ''}" placeholder="58,18"></label>
        <label for="pLitres">Litros<input id="pLitres" inputmode="decimal" value="${v.litres != null ? nf(v.litres, 2) : ''}" placeholder="41,00"></label>
        <label for="pPl">€/L<input id="pPl" inputmode="decimal" value="${v.price_l != null ? nf(v.price_l, 3) : ''}" placeholder="1,419"></label>
      </div>
      <p class="muted">${target ? 'Se guarda en el repostaje del ' + new Date(target.ts).toLocaleDateString('es-ES', { day: 'numeric', month: 'long' }) + '.' : 'Se guarda en el repostaje de hoy. Si el coche aún no lo ha detectado, lo apunto en cuanto arranques.'}</p>`}
      <div class="btns"><button class="btn sec" type="button" data-close>Cancelar</button><button class="btn" type="submit" ${sheet.reading ? 'disabled' : ''}>Guardar</button></div>
    </form>`;
  }
  if (sheet.type === 'parking') {
    const p = parking || {};
    const left = p.timer_at ? Math.max(0, Math.round((p.timer_at - Date.now()) / 60e3)) : null;
    return `<form class="sheet" id="sheetForm">
      <span class="k">Aparcado desde las ${p.ts ? hm(p.ts) : '—'}</span>
      <label for="pNote">Nota<input id="pNote" value="${esc(p.note || '')}" placeholder="Planta -2, plaza 34"></label>
      <span class="k">Avisarme antes de que acabe la zona azul${left != null ? ` · quedan ${left} min` : ''}</span>
      <div class="g3">${[30, 60, 90, 120, 180].map(m => `<button type="button" class="btn sec" data-min="${m}" style="min-height:44px">${m < 60 ? m + ' min' : nf(m / 60, m % 60 ? 1 : 0) + ' h'}</button>`).join('')}<button type="button" class="btn danger" data-min="0" style="min-height:44px">Quitar</button></div>
      <p class="muted">Te aviso 10 minutos antes de que se acabe el tiempo.</p>
      <button type="button" class="btn sec" id="pPlace">📍 Guardar este sitio como lugar (Casa, Trabajo…)</button>
      ${places.length ? `<p class="muted">Lugares: ${places.map(p => esc(p.name)).join(' · ')}</p>` : ''}
      <div class="btns"><button class="btn sec" type="button" data-close>Cerrar</button><button class="btn" type="submit">Guardar nota</button></div>
    </form>`;
  }
  if (sheet.type === 'shareimg') {
    return `<form class="sheet" id="sheetForm" style="max-height:90vh;overflow:auto">
      <span class="k">Imagen del trayecto</span>
      <img src="${sheet.url}" alt="Imagen del trayecto para compartir" style="width:100%;border-radius:12px">
      <div class="btns"><button class="btn sec" type="button" data-close>Cerrar</button><button class="btn" type="submit">Compartir</button></div>
    </form>`;
  }
  if (sheet.type === 'donecost') {
    return `<form class="sheet" id="sheetForm">
      <span class="k">${esc(sheet.name)} · apuntado con los km de hoy</span>
      <label for="dcEur">¿Cuánto te ha costado? (€)<input id="dcEur" inputmode="decimal" placeholder="Déjalo vacío si no ha costado nada"></label>
      <p class="muted">Se suma a Gastos del coche (categoría Taller).</p>
      <div class="btns"><button class="btn sec" type="button" data-close>Sin gasto</button><button class="btn" type="submit">Guardar gasto</button></div>
    </form>`;
  }
  if (sheet.type === 'tread') {
    const l = (tyreSet && tyreSet.tread_last) || {};
    const zv = (k, z) => { const v = l[k]; return v == null ? null : typeof v === 'number' ? (z === 'c' ? v : null) : v[z]; };
    const wheel = (k, lab) => `<div class="col" style="gap:4px"><span class="k">${lab}</span><div class="g3" style="gap:6px">
      ${[['o', 'Ext.'], ['c', 'Centro'], ['i', 'Int.']].map(([z, zl]) => `<label for="tr_${k}_${z}" style="font-size:10px">${zl}<input id="tr_${k}_${z}" inputmode="decimal" placeholder="${zv(k, z) != null ? nf(zv(k, z), 1) : '6,0'}"></label>`).join('')}</div></div>`;
    return `<form class="sheet" id="sheetForm" style="max-height:88vh;overflow:auto">
      <span class="k">Profundidad del dibujo (mm)</span>
      ${wheel('fl', 'Delantera izquierda')}${wheel('fr', 'Delantera derecha')}${wheel('rl', 'Trasera izquierda')}${wheel('rr', 'Trasera derecha')}
      <label for="trNew">Dibujo de nuevas (mm)<input id="trNew" inputmode="decimal" placeholder="${nf((tyreSet && tyreSet.new_mm) || 7.1, 1)}"></label>
      <p class="muted">Ext. = lado de fuera del coche, Int. = lado de dentro. Mide en un surco de cada zona. Puedes rellenar solo el centro si no tienes tiempo. Sin medidor: con una moneda de 1 €, si se ve entera la franja dorada quedan unos 3 mm o menos.</p>
      <div class="btns"><button class="btn sec" type="button" data-close>Cancelar</button><button class="btn" type="submit">Guardar</button></div>
    </form>`;
  }
  if (sheet.type === 'tyreset') {
    const t = tyreSet || {};
    return `<form class="sheet" id="sheetForm">
      <span class="k">Neumáticos montados</span>
      <label for="tyModel">Modelo<input id="tyModel" value="${esc(t.model || '')}" placeholder="Goodyear Eagle F1 SuperSport"></label>
      <label for="tySize">Medida<input id="tySize" value="${esc(t.size || '')}" placeholder="225/40 R18"></label>
      <div class="g2"><label for="tyDate">Montadas el<input id="tyDate" type="date" value="${esc(t.mounted_date || '')}"></label>
      <label for="tyKm">Km al montarlas<input id="tyKm" inputmode="numeric" value="${t.mounted_km != null ? t.mounted_km : ''}" placeholder="${t.odometer != null ? t.odometer : ''}"></label></div>
      <div class="g2"><label for="tyTrk">Km de circuito sin registrar<input id="tyTrk" inputmode="numeric" value="${t.track_extra_km != null ? t.track_extra_km : ''}" placeholder="vueltas × longitud"></label>
      <label for="tyTrd">Días de circuito sin registrar<input id="tyTrd" inputmode="numeric" value="${t.track_extra_days != null ? t.track_extra_days : ''}" placeholder="0"></label></div>
      <p class="muted">Si no recuerdas los km exactos, pon una aproximación. Circuito: las tandas de antes de tener la app (p. ej. 47 vueltas a Albacete × 3,55 km = 167 km). Las que haga la app ya las cuenta sola. Aviso de rotar cada 10.000 km.</p>
      <div class="btns"><button class="btn sec" type="button" data-close>Cancelar</button><button class="btn" type="submit">Guardar</button></div>
    </form>`;
  }
  if (sheet.type === 'deadline') {
    const d = sheet.item || {};
    return `<form class="sheet" id="sheetForm">
      <span class="k">${d.id ? esc(d.name) : 'Nueva fecha'}</span>
      <label for="dName">Nombre<input id="dName" value="${esc(d.name || '')}" placeholder="Revisión del extintor"></label>
      <label for="dDate">Vence el<input id="dDate" type="date" value="${esc(d.date || '')}"></label>
      <div class="btns"><button class="btn sec" type="button" data-close>Cancelar</button><button class="btn" type="submit">Guardar</button></div>
      ${d.id ? '<button class="btn danger" type="button" id="dDelete">Quitar</button>' : ''}
    </form>`;
  }
  if (sheet.type === 'expense') {
    const x = sheet.item || {};
    return `<form class="sheet" id="sheetForm">
      <span class="k">${x.id ? 'Editar gasto' : 'Nuevo gasto'}</span>
      <label for="xCat">Tipo<select id="xCat" style="font:16px var(--body);background:#0b0d10;color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:12px">${(expenses ? expenses.cats : ['Otros']).map(c => `<option${c === (x.cat || 'Taller') ? ' selected' : ''}>${c}</option>`).join('')}</select></label>
      <label for="xDesc">Concepto<input id="xDesc" value="${esc(x.desc || '')}" placeholder="Cambio de aceite y filtro"></label>
      <div class="g2"><label for="xEur">Importe (€)<input id="xEur" inputmode="decimal" value="${x.eur != null ? nf(x.eur, 2) : ''}" placeholder="120,00"></label>
      <label for="xDate">Fecha<input id="xDate" type="date" value="${esc(x.date || new Date().toISOString().slice(0, 10))}"></label></div>
      <div class="btns"><button class="btn sec" type="button" data-close>Cancelar</button><button class="btn" type="submit">Guardar</button></div>
      ${x.id ? '<button class="btn danger" type="button" id="xDelete">Borrar gasto</button>' : ''}
    </form>`;
  }
  if (sheet.type === 'tracknote') {
    const d = sheet.item;
    return `<form class="sheet" id="sheetForm">
      <span class="k">${esc(d.circuit)} · ${new Date(d.day).toLocaleDateString('es-ES', { day: 'numeric', month: 'long' })}</span>
      <label for="tnNote">Notas del día<textarea id="tnNote" rows="7" style="font:15px var(--body);background:#0b0d10;color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:12px" placeholder="Presiones en frío/caliente, reglajes, tiempos, qué mejorar…">${esc(d.note || '')}</textarea></label>
      <div class="btns"><button class="btn sec" type="button" data-close>Cancelar</button><button class="btn" type="submit">Guardar</button></div>
    </form>`;
  }
  const i = sheet.item || {};
  return `<form class="sheet" id="sheetForm">
    <span class="k">${i.id ? 'Editar tarea' : 'Nueva tarea'}</span>
    <label for="mName">Nombre<input id="mName" value="${esc(i.name || '')}" placeholder="Aceite y filtro" required></label>
    <div class="g2">
      <label for="mKm">Cada (km)<input id="mKm" inputmode="numeric" value="${i.interval_km ?? ''}" placeholder="15000"></label>
      <label for="mMo">Cada (meses)<input id="mMo" inputmode="numeric" value="${i.interval_months ?? ''}" placeholder="12"></label>
      <label for="mLastKm">Último (km)<input id="mLastKm" inputmode="numeric" value="${i.last_km != null ? Math.round(i.last_km) : ''}" placeholder="${maint && maint.odometer ? Math.round(maint.odometer) : ''}"></label>
      <label for="mLastDate">Última fecha<input id="mLastDate" type="date" value="${i.last_date || ''}"></label>
    </div>
    <label for="mNotes">Notas<input id="mNotes" value="${esc(i.notes || '')}" placeholder="Aceite 5W-30, pastillas PBS ProRace…"></label>
    <div class="btns"><button class="btn sec" type="button" data-close>Cancelar</button><button class="btn" type="submit">Guardar</button></div>
    ${i.id ? '<button class="btn danger" type="button" id="mDelete">Borrar tarea</button>' : ''}
  </form>`;
}

// ---------- Modo conducción ----------
function renderDrive() {
  const host = $('#driveHost');
  const c = live;
  const running = c && c.ignition !== 'off';
  const show = c && driveForced && running; // solo si la abres tú (los datos llegan cada pocos minutos)
  if (!show) { host.innerHTML = ''; return; }
  const night = c.location ? !sunUp(c.location.lat, c.location.lon) : (new Date().getHours() >= 19 || new Date().getHours() < 8);
  const wt = c.oil_c ?? c.coolant_c, hot = c.oil_c != null ? 80 : 85;
  const oilCol = wt >= hot ? 'var(--ok)' : wt >= 60 ? 'var(--wa)' : 'var(--blue)';
  const tl = c.trip_live || {};
  const ago2 = c.data_ts ? Math.round((Date.now() - c.data_ts) / 60e3) : null;
  host.innerHTML = `<button id="drive" class="${night ? 'night' : ''}" aria-label="Salir de la pantalla del viaje">
    <span class="row" style="width:100%"><span class="k" style="color:var(--ac);display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:var(--ac)"></span>Viaje en curso${night ? ' · noche' : ''}</span>
      <span class="m" style="font-size:13px;color:#7d858f">${new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}</span></span>
    <span class="col" style="flex:1;align-items:center;justify-content:center;width:100%;gap:6px">
      <span class="big-speed" style="font-size:96px">${tl.km != null ? nf(tl.km) : '0'}</span><span class="k" style="font-size:14px">km recorridos · ${tl.mins != null ? clock(tl.mins * 60) : '—'}</span>
      <span class="m" style="font-size:22px;font-weight:700;margin-top:14px">${tl.avg != null ? nf(tl.avg) + ' km/h de media' : ''}</span>
      ${tl.fuel_l != null ? `<span class="m" style="font-size:16px;color:#9aa2ab">${nf(tl.fuel_l, 1)} L${tl.l100 ? ' · ' + nf(tl.l100, 1) + ' l/100' : ''}</span>` : ''}
    </span>
    <span style="display:grid;grid-template-columns:1fr 1fr;align-items:end;gap:12px;width:100%">
      <span class="col" style="gap:4px"><span class="k">${c.oil_c != null ? 'Aceite' : 'Motor'}</span><span class="m" style="font-size:40px;font-weight:700;color:${oilCol};line-height:1">${nf(wt)}°</span><span style="font-size:12px;color:${oilCol}">${wt >= hot ? 'A temperatura' : wt >= 60 ? 'Calentando' : 'Frío: suave'}</span></span>
      <span class="col" style="gap:4px;align-items:flex-end"><span class="k">Autonomía</span><span class="m" style="font-size:40px;font-weight:700;line-height:1">${nf(c.range_km)}</span><span style="font-size:12px;color:#7d858f">km · ${nf(c.fuel_pct)} %</span></span>
    </span>

function renderBadge() {
  const running = live && live.ignition !== 'off';
  const state = !live ? '' : running ? `<span class="chip live" style="color:${C.ac}"><i></i>En marcha</span>`
    : live.locked === false && live.lock_checking ? `<span class="chip" style="color:${C.wa}"><i></i>Comprobando cierre…</span>`
    : live.locked === false ? `<span class="chip" style="color:${C.bad}"><i></i>Abierto</span>` : `<span class="chip" style="color:${C.ok}"><i></i>Cerrado</span>`;
  const src = live && live.source === 'mock' ? `<span class="chip" style="color:${C.wa}">Prueba</span>` : '';
  $('#badge').innerHTML = tab === 'ajustes' ? '' : tab === 'estado' ? state : src;
  const [sub, title] = tripDetail && tab === 'viajes' ? [`${dayLabel(tripDetail.start_ts)} · ${hm(tripDetail.start_ts)} → ${hm(tripDetail.end_ts)}`, (tripDetail.from || tripDetail.to ? `${(tripDetail.from || '…').toUpperCase()} → ${(tripDetail.to || '…').toUpperCase()}` : `TRAYECTO #${pad2(tripDetail.id)}`)] : tab === 'estado' && carCfg ? [carCfg.model, carCfg.name.toUpperCase()] : TITLES[tab];
  $('#hSub').textContent = sub; $('#hTitle').textContent = title;
}

function render() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#nav').style.display = tab === 'ajustes' ? 'none' : 'grid';
  renderBadge();
  let html = '';
  if (tripDetail && tab === 'viajes') html += `<button class="btn sec" id="backTrips" style="align-self:flex-start;min-height:40px">← Trayectos</button>`;
  if (notice) html += `<div class="okmsg">${esc(notice)}</div>`;
  if (error) html += `<div class="err">${esc(error)}</div>`;
  const wait = '<div class="pn pad"><p class="muted">Conectando con el coche…</p></div>';
  if (tab === 'ajustes') html += viewAjustes();
  else if (tab === 'estado') html += live ? viewEstado(live) : error ? '' : wait;
  else if (tab === 'motor') html += live ? viewMotor(live) : error ? '' : wait;
  else if (tab === 'viajes') html += viewViajes();
  else if (tab === 'datos') html += viewDatos();
  else if (tab === 'taller') html += viewTaller();
  const main = $('#main');
  main.classList.toggle('anim', animate);
  main.innerHTML = html;
  if (animate) countUp();
  animate = false;
  $('#sheetHost').innerHTML = sheet ? `<div class="sheet-bg" id="sheetBg">${sheetHtml()}</div>` : '';
  afterRender();
}

function countUp() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count; if (!isFinite(to)) return;
    const t0 = performance.now(), D = 900;
    const step = now => { const p = Math.min(1, (now - t0) / D); el.textContent = nf(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

// Foto del surtidor: se reduce en el móvil y la IA del servidor lee importe, litros y €/L
// Input fijo fuera de lo que se repinta: así iOS siempre entrega la foto aunque la pantalla se refresque
let pumpTs = null;
const pumpFile = (() => {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.id = 'pumpFile'; i.className = 'pumpIn';
  document.body.appendChild(i);
  i.addEventListener('change', () => { pumpChosen(i); });
  return i;
})();
async function pumpChosen(inp) {
  const f = inp.files && inp.files[0]; if (!f) return;
  const ts = pumpTs; inp.value = '';
  try {
    const img = await shrinkImage(f, 1400);
    sheet = { type: 'pump', ts, img, reading: true }; render();
    let read;
    try { read = await api('/api/pump/read', { method: 'POST', body: JSON.stringify({ image: img }) }); }
    catch (e) { read = { error: e.message }; }
    if (sheet && sheet.type === 'pump' && sheet.img === img) { sheet.reading = false; sheet.read = read; render(); }
  } catch (e) { error = 'No he podido abrir la foto: ' + (e.message || e); render(); }
}
function shrinkImage(file, max) {
  return new Promise((ok, ko) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); URL.revokeObjectURL(u);
      ok(cv.toDataURL('image/jpeg', 0.82));
    };
    im.onerror = () => { URL.revokeObjectURL(u); ko(new Error('formato de imagen no compatible')); }; im.src = u;
  });
}
async function loadPumpPhoto(ts) {
  const el = $('#sPhoto'); if (!el) return;
  try {
    const r = await fetch(cfg.url.replace(/\/+$/, '') + '/api/refuels/' + ts + '/photo', { headers: { 'x-app-key': cfg.key } });
    if (r.ok) el.src = URL.createObjectURL(await r.blob()); else el.remove();
  } catch (e) { el.remove(); }
}

        sheet = null; flash('Nota guardada');
      } else if (sheet.type === 'pump') {
        const r = await api('/api/pump/save', { method: 'POST', body: JSON.stringify({ ts: sheet.ts, total: num($('#pTotal').value), litres: num($('#pLitres').value), price_l: num($('#pPl').value), image: sheet.img }) });
        refuels = await api('/api/refuels'); loaded.datos = Date.now();
        sheet = null; flash(r.pending ? 'Apuntado: lo pongo en el repostaje cuando el coche lo detecte' : 'Repostaje guardado con la foto');
      } else if (sheet.type === 'refuel') {
        const price = $('#sPrice').value.trim();
        await api('/api/refuels/' + sheet.item.ts, { method: 'POST', body: JSON.stringify({ price_total: price ? num(price) : null, station: $('#sStation').value.trim(), litres: $('#sLitres').value.trim() || null }) });
        refuels = await api('/api/refuels'); loaded.datos = Date.now();
        sheet = null; flash('Repostaje guardado');
      } else {
        const body = { id: sheet.item && sheet.item.id, name: $('#mName').value, interval_km: num($('#mKm').value), interval_months: num($('#mMo').value),
          last_km: num($('#mLastKm').value), last_date: $('#mLastDate').value, notes: $('#mNotes').value };
        maint = await api('/api/maintenance', { method: 'POST', body: JSON.stringify(body) }); loaded.maint = Date.now();
        sheet = null; flash('Tarea guardada');
      }
    } catch (err) {
      btn.disabled = false;
      let m = form.querySelector('.err');
      if (!m) { m = document.createElement('div'); m.className = 'err'; form.prepend(m); }
      m.textContent = err.message;
    }
  };
  form.querySelectorAll('[data-min]').forEach(b => b.onclick = async () => {
    try {
      parking = await api('/api/parking', { method: 'POST', body: JSON.stringify({ minutes: +b.dataset.min }) });
      sheet = null; flash(+b.dataset.min ? `Te aviso 10 minutos antes de que pasen ${b.textContent.trim()}` : 'Temporizador quitado');
    } catch (e) { error = e.message; sheet = null; render(); }
  });
  const pp = $('#pPlace'); if (pp) pp.onclick = async () => {
    const name = prompt('Nombre del lugar (se guarda donde está aparcado el coche):', places.length ? '' : 'Casa');
    if (!name) return;
    try { places = (await api('/api/places', { method: 'POST', body: JSON.stringify({ name }) })).places; loaded.trips = 0; flash('Lugar guardado: ' + name); }
    catch (e) { error = e.message; render(); }
  };
  const xd = $('#xDelete'); if (xd) xd.onclick = async () => {
    try { expenses = await api('/api/expenses', { method: 'POST', body: JSON.stringify({ delete: sheet.item.id }) }); sheet = null; flash('Gasto borrado'); }
    catch (e) { error = e.message; sheet = null; render(); }
  };
  const dd = $('#dDelete'); if (dd) dd.onclick = async () => {
    try { deadlines = (await api('/api/deadlines/' + encodeURIComponent(sheet.item.id), { method: 'DELETE' })).items; sheet = null; flash('Fecha quitada'); }
    catch (e) { error = e.message; sheet = null; render(); }
  };
  const del = $('#mDelete'); if (del) del.onclick = async () => {
    if (del.dataset.confirm !== '1') { del.dataset.confirm = '1'; del.textContent = 'Toca otra vez para borrar'; return; }
    try { maint = await api('/api/maintenance/' + sheet.item.id, { method: 'DELETE' }); sheet = null; flash('Tarea borrada'); }
    catch (e) { error = e.message; sheet = null; render(); }
  };
}
function closeSheet() { sheet = null; render(); }
function flash(msg) { notice = msg; error = null; render(); setTimeout(() => { if (notice === msg) { notice = null; if (!sheet) render(); } }, 2500); }

async function copyCsv() {
  const lines = [['fecha', 'km', 'litros', 'precio_total_eur', 'eur_litro', 'consumo_l100km', 'gasolinera', 'precio_estimado'].join(';')];
  for (const r of refuels.refuels.slice().reverse()) lines.push([new Date(r.ts).toISOString().slice(0, 10), Math.round(r.odometer), nf(r.litres, 1),
    r.price_total != null ? nf(r.price_total, 2) : '', r.price_l != null ? nf(r.price_l, 3) : '', r.l100 != null ? nf(r.l100, 1) : '', r.station || '', r.price_auto ? 'sí' : ''].join(';'));
  try { await navigator.clipboard.writeText(lines.join('\n')); flash('CSV copiado: pégalo en tu Cuaderno o en una hoja de cálculo'); }
  catch (e) { error = 'No se pudo copiar al portapapeles.'; render(); }
}

// ---------- Avisos push ----------
function b64ToU8(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function enablePush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || typeof Notification === 'undefined')
    throw new Error('Este navegador no admite avisos. En iPhone, abre la app desde el icono de la pantalla de inicio.');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('No has dado permiso. Puedes activarlo en Ajustes del iPhone → Notificaciones → Fiesta ST.');
  const reg = await navigator.serviceWorker.ready;
  const { key } = await api('/api/push/key');
  let sub = await reg.pushManager.getSubscription();
  if (sub) {
    const cur = sub.options && sub.options.applicationServerKey;
    if (cur && btoa(String.fromCharCode(...new Uint8Array(cur))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') !== key) { await sub.unsubscribe(); sub = null; }
  }
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(key) });
  await api('/api/push/subscribe', { method: 'POST', body: JSON.stringify(sub.toJSON()) });
}

// ---------- Navegación ----------
function go(t) {
  tab = t; sheet = null; animate = true;
  if (t !== 'viajes') tripDetail = null;
  if (TABS.includes(t) && location.hash !== '#' + t) history.replaceState(null, '', '#' + t);
  render();
  if (t === 'ajustes') { clearTimeout(timer); if (cfg.url) loadFor('ajustes'); } else { loadFor(t); schedule(); }
}
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => {
  if (b.dataset.tab === 'viajes' && tab === 'viajes') tripDetail = null;
  go(b.dataset.tab);
});
$('#cfgBtn').onclick = () => go('ajustes');
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== tab) go(h); });
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && cfg.url && tab !== 'ajustes') { loadLive(); loadFor(tab, true); } else clearTimeout(timer);
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
// Alto real de la pantalla: iOS en modo app (icono) a veces informa de menos alto y deja la parte de abajo cortada.
function fitScreen() {
  const portrait = window.matchMedia('(orientation: portrait)').matches;
  // iOS 26 en modo app solo pinta hasta innerHeight (el resto queda en negro): la app ocupa justo eso
  // y, si sobra la franja de abajo, la barra no necesita el margen de la raya de inicio.
  const h = window.innerHeight;
  const full = portrait ? Math.max(screen.height, screen.width) : Math.min(screen.height, screen.width);
  document.documentElement.classList.toggle('vpshort', standalone && full - h > 30);
  document.documentElement.style.setProperty('--app-h', h + 'px');
}
fitScreen();
['resize', 'orientationchange', 'pageshow', 'focus'].forEach(ev => window.addEventListener(ev, () => { fitScreen(); setTimeout(fitScreen, 300); }));
document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(fitScreen, 100); });
setTimeout(fitScreen, 100); setTimeout(fitScreen, 800);


render();
if (cfg.url && cfg.key) {
  loadLive(); loadFor(tab);
  if (tab !== 'datos') api('/api/refuels').then(r => { refuels = r; if (tab === 'estado' && !sheet) render(); }).catch(() => {});
}
