<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Garaje">
<meta name="theme-color" content="#0a0b0d">
<title>Mi Garaje</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter+Tight:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  /* Telemetría: negro de pista, amarillo de señal, verde/ámbar/rojo para estados */
  --bg:#0a0b0d; --pn:#101215; --ln:#23272c; --ln2:#1b1e22; --tx:#f4f5f6; --mu:#7d858f;
  --ac:#ffd400; --ok:#2ee59d; --wa:#ffb21e; --bad:#ff4d3d; --blue:#4aa3ff;
  --mono:'Chakra Petch',ui-monospace,monospace; --body:'Inter Tight',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--body);-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);position:fixed;top:0;left:0;right:0;bottom:auto;height:100vh;height:100dvh;height:var(--app-h,100dvh);overflow:hidden}
header{padding:16px 20px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
main{flex:1;min-height:0;overflow-y:auto;padding:0 16px 24px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
main>*,body>header,body>nav,nav{flex-shrink:0}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.35)}
.vpshort nav{padding-bottom:8px}
nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--ln2);background:var(--bg);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 11px var(--mono);letter-spacing:.08em;min-height:52px;text-transform:uppercase}
nav button.on{color:var(--ac)}
button{cursor:pointer;font-family:var(--body);color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.m{font-family:var(--mono);font-variant-numeric:tabular-nums}
.k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);font-weight:600}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:14px}
.pad{padding:14px 16px}
.col{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.title{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.02em;line-height:1.1}
.muted{color:var(--mu);font-size:13px;margin:0}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ln);border-radius:8px;padding:7px 10px;font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;display:block}
.live i{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.tag{font:600 11px var(--mono);letter-spacing:.08em;border-radius:6px;padding:3px 8px;border:1px solid;text-transform:uppercase;white-space:nowrap}
.alert{border:1px solid #4a3a12;background:#1f1a0d;color:var(--wa);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600}
.err{border:1px solid #4a1d18;background:#1f0f0d;color:#ff9a8f;border-radius:12px;padding:12px 14px;font-size:14px}
.okmsg{border:1px solid #17402e;background:#0d1f17;color:#9cf2cd;border-radius:12px;padding:12px 14px;font-size:14px}
label.btn{flex-direction:row;font:700 13px var(--mono);letter-spacing:.08em;color:#0a0b0d;cursor:pointer}
label.btn.sec{color:var(--tx)}
.pumpIn{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.btn{min-height:46px;border:0;border-radius:10px;font:700 13px var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--ac);color:#0a0b0d;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.btn.ghost{background:transparent;color:var(--ac);border:1px dashed #3a3f46}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #4a1d18}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns>*{flex:1}
.li{display:grid;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--ln2);padding:12px 0}
.bar{height:10px;border-radius:5px;background:#1d2126;overflow:hidden}.bar>div{height:100%;border-radius:5px}
label{display:flex;flex-direction:column;gap:6px;font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
input{font:16px var(--body);padding:12px;border-radius:10px;border:1px solid var(--ln);background:#0d0f11;color:var(--tx);width:100%}
.seg-pick{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.seg-pick button{background:none;border:0;min-height:44px;font:700 13px var(--mono);color:var(--mu)}
.seg-pick button.on{background:var(--ac);color:#0a0b0d}
.map{width:100%;height:220px;background:#0f1114}
.mini{width:68px;height:68px;border-radius:10px;overflow:hidden;flex:none;background:#15181c}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:2000}
.sheet{background:var(--pn);border:1px solid var(--ln);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:90%;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.leaflet-container{background:#0f1114;font-family:var(--body)}
.leaflet-control-attribution{font-size:9px;background:rgba(10,11,13,.7)!important;color:#7d858f!important}
.leaflet-control-attribution a{color:#9aa1a9!important}
svg text{font-family:var(--mono)}
/* Animaciones de entrada (solo al cambiar de pestaña) */
.anim .pn,.anim .alert{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.anim .pn:nth-child(2){animation-delay:.04s}.anim .pn:nth-child(3){animation-delay:.08s}.anim .pn:nth-child(4){animation-delay:.12s}.anim .pn:nth-child(5){animation-delay:.16s}.anim .pn:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.anim .arc{animation:arc 1.1s cubic-bezier(.2,.8,.2,1) both .1s}
@keyframes arc{from{stroke-dashoffset:var(--len)}}
.anim .rseg{animation:seg .25s both}
@keyframes seg{from{opacity:.05}}
@media (prefers-reduced-motion:reduce){.anim *{animation:none!important}.live i{animation:none}}
/* Modo conducción */
#drive{position:fixed;inset:0;z-index:3000;background:#000;color:#f4f5f6;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));gap:18px;border:0;text-align:left;width:100%}
#drive.night{--ac:#ff8a3d;--ok:#3fbf8a;color:#b9b2a8}
#drive.night .big-speed{color:#d8d0c4}
.big-speed{font-family:var(--mono);font-weight:700;font-size:min(46vw,190px);line-height:.85;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gear-box{width:112px;height:122px;background:var(--ac);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#000}
</style>
</head>
<body>
<header>
  <div class="col" style="gap:2px"><span class="k" id="hSub">Fiesta ST · Mk8</span><span class="title" id="hTitle">MI ST</span></div>
  <div style="display:flex;align-items:center;gap:8px">
    <span id="badge"></span>
    <button class="chip" id="cfgBtn" aria-label="Ajustes" style="padding:9px;background:none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-tab="estado"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 13l2-5a2 2 0 0 1 2-1h10a2 2 0 0 1 2 1l2 5v4h-2a2 2 0 0 1-4 0H9a2 2 0 0 1-4 0H3z"/></svg>Estado</button>
  <button data-tab="viajes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h6a4 4 0 0 0 0-8h-4a4 4 0 0 1 0-8h6"/></svg>Viajes</button>
  <button data-tab="motor"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 14l4-4"/><path d="M3.3 17a9 9 0 1 1 17.4 0"/></svg>Motor</button>
  <button data-tab="datos"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Datos</button>
  <button data-tab="taller"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>Taller</button>
</nav>
<div id="sheetHost"></div>
<div id="driveHost"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const nf = (v, d = 0) => v == null || isNaN(v) ? '—' : Number(v).toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const C = { ac: '#ffd400', ok: '#2ee59d', wa: '#ffb21e', bad: '#ff4d3d', blue: '#4aa3ff', mu: '#7d858f', tx: '#f4f5f6' };
const TABS = ['estado', 'viajes', 'motor', 'datos', 'taller'];
const TITLES = { estado: ['Fiesta ST · Mk8', 'MI ST'], viajes: ['Últimos trayectos', 'VIAJES'], motor: ['Telemetría', 'MOTOR'], datos: ['Consumo, gasto y batería', 'DATOS'], taller: ['Mantenimiento', 'TALLER'], ajustes: ['Conexión y avisos', 'AJUSTES'] };
// CARTO ahora pide clave: mapa de OpenStreetMap (gratis, sin clave) oscurecido con un filtro.
const TILE = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

let cfg = {};
try { cfg = JSON.parse(localStorage.getItem('fst_cfg') || '{}'); } catch (e) {}
cfg.fuel = cfg.fuel === '95' ? '95' : '98';
const hashTab = location.hash.slice(1);
let tab = !(cfg.url && cfg.key) ? 'ajustes' : TABS.includes(hashTab) ? hashTab : 'estado';
let live = null, hist = null, battery = null, refuels = null, trips = null, records = null, tripDetail = null, maint = null, fuel = null, fuelErr = null;
let error = null, notice = null, timer = null, sheet = null, loaded = {}, animate = true;
let trackPrepData = null, prepTab = 'antes';
let carCfg = (() => { try { return JSON.parse(localStorage.getItem('fst_car') || 'null'); } catch (e) { return null; } })(), fordSt = null, backups = null, favHist = null, advice = null, monthSum = null, engine = null, lastTrip = null, viajesPeriod = 'semana', tripFilter = 'todos', tripsAll = false, expenses = null, commute = null, places = [], tyrePrefs = null, tyreSet = null, deadlines = null, trackdays = null, driveDismissed = false, driveForced = false, parking = null, guard = null, circuits = null, customCircuits = [];

// ---------- Vibración (Android: vibrate; iPhone: truco del interruptor nativo) ----------
const hapEl = (() => {
  const l = document.createElement('label');
  l.setAttribute('aria-hidden', 'true');
  l.style.cssText = 'position:fixed;left:-100px;top:0;width:1px;height:1px;overflow:hidden;opacity:0';
  const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); i.tabIndex = -1;
  l.appendChild(i); document.body.appendChild(l); return l;
})();
function haptic() { try { if (navigator.vibrate) navigator.vibrate(8); else hapEl.click(); } catch (e) {} }
document.addEventListener('click', e => { if (e.target.closest('button, a.btn, a.li')) haptic(); }, true);

// ---------- API ----------
async function api(path, opts = {}) {
  const headers = { 'x-app-key': cfg.key };
  if (opts.body) headers['content-type'] = 'application/json';
  let r;
  try { r = await fetch(cfg.url.replace(/\/+$/, '') + path, { ...opts, headers }); }
  catch (e) { throw new Error('No se puede conectar con el servidor. Revisa la URL en Ajustes o tu conexión.'); }
  const j = await r.json().catch(() => ({ error: 'El servidor no ha devuelto datos válidos' }));
  if (!r.ok) throw new Error(j.error || 'Error ' + r.status);
  return j;
}

async function loadLive() {
  const wasRunning = live && live.ignition !== 'off';
  try { live = await api('/api/live'); error = null; } catch (e) { error = e.message; }
  const running = live && live.ignition !== 'off';
  if (!running) driveDismissed = false;
  if (running && !wasRunning && !driveDismissed) haptic();
  renderDrive();
  if (!sheet && ['estado', 'motor'].includes(tab)) render(); else renderBadge();
  schedule();
}

const stale = (key, ms) => !loaded[key] || Date.now() - loaded[key] > ms;
async function loadFor(t, force) {
  const jobs = [];
  const add = (key, ms, fn) => { if (force || stale(key, ms)) jobs.push(fn().then(() => { loaded[key] = Date.now(); })); };
  if (t === 'estado') add('parking', 30e3, async () => { parking = await api('/api/parking'); });
  if (t === 'ajustes') add('guard', 30e3, async () => { guard = await api('/api/guard'); });
  if (t === 'ajustes') add('tyres', 300e3, async () => { tyrePrefs = await api('/api/tyres'); });
  if (t === 'ajustes') add('fordst', 60e3, async () => { [fordSt, backups] = await Promise.all([api('/api/ford/status'), api('/api/backups').catch(() => ({ backups: [] }))]); });
  if (t === 'estado' || t === 'motor') add('battery', 300e3, async () => { battery = await api('/api/battery'); });
  if (t === 'taller') { add('tyreset', 60e3, async () => { tyreSet = await api('/api/tyreset'); }); add('deadlines', 60e3, async () => { deadlines = (await api('/api/deadlines')).items; }); }
  if (t === 'viajes') add('trackdays', 120e3, async () => { trackdays = (await api('/api/trackdays')).days; });
  if (t === 'estado' || t === 'taller') add('maint', t === 'taller' ? 30e3 : 300e3, async () => { maint = await api('/api/maintenance'); });
  if (t === 'estado' || t === 'datos') add('fuel', 600e3, async () => {
    try { fuel = await api('/api/fuel?type=' + cfg.fuel); fuelErr = null; } catch (e) { fuelErr = e.message; }
  });
  if (t === 'viajes') {
    add('trips', 60e3, async () => { const r = await api('/api/trips?limit=200'); trips = r.trips; commute = r.commute; places = r.places || []; });
    add('records', 300e3, async () => { records = await api('/api/trips/records'); });
    add('circuits', 300e3, async () => { const r = await api('/api/circuits'); circuits = r.circuits; customCircuits = r.custom || []; });
  }
  if (t === 'datos') add('datos', 120e3, async () => { [hist, refuels] = await Promise.all([api('/api/history?days=7'), api('/api/refuels')]); });
  if (t === 'datos') add('favhist', 600e3, async () => { favHist = await api('/api/fuel/fav/prices'); });
  add('carcfg', 3600e3, async () => { carCfg = await api('/api/car-config'); try { localStorage.setItem('fst_car', JSON.stringify(carCfg)); } catch (e) {} });
  if (t === 'estado') add('lasttrip', 120e3, async () => { const r = await api('/api/trips?limit=1'); lastTrip = r.trips && r.trips[0] || null; });
  if (t === 'estado' || t === 'datos') add('advice', 900e3, async () => { advice = await api('/api/fuel/advice'); });
  if (t === 'viajes') add('month', 600e3, async () => { monthSum = await api('/api/month'); });
  if (t === 'motor') add('trackprep', 1800e3, async () => { trackPrepData = await api('/api/trackprep'); });
  if (t === 'motor') add('engine', 600e3, async () => { engine = await api('/api/engine?days=30'); });
  if (t === 'datos') add('expenses', 120e3, async () => { expenses = await api('/api/expenses'); });
  if (!jobs.length) return;
  try { await Promise.all(jobs); error = null; } catch (e) { error = e.message; }
  if (tab === t && !sheet) render();
}

function schedule() {
  clearTimeout(timer);
  if (document.hidden || !cfg.url || tab === 'ajustes') return;
  const running = live && live.ignition !== 'off';
  timer = setTimeout(loadLive, running ? 5000 : 60000);
}

// ---------- Formatos ----------
function titleCaseJs(t) { return String(t || '').toLowerCase().replace(/(^|[\s-])\p{L}/gu, m => m.toUpperCase()); }
function ago(ts) {
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 30) return 'ahora mismo';
  if (s < 60) return 'hace ' + s + ' s';
  if (s < 3600) return 'hace ' + Math.round(s / 60) + ' min';
  if (s < 86400) return 'hace ' + Math.round(s / 3600) + ' h';
  return 'hace ' + Math.round(s / 86400) + ' d';
}
const hm = ts => new Date(ts).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
function dayLabel(ts) {
  const d = new Date(ts), t = new Date(), k = x => x.toDateString();
  if (k(d) === k(t)) return 'Hoy';
  const y = new Date(t); y.setDate(t.getDate() - 1);
  if (k(d) === k(y)) return 'Ayer';
  return d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric' });
}
const clock = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return h ? `${h}h${String(m).padStart(2, '0')}` : `${m}:${String(ss).padStart(2, '0')}`; };
const tyreLow = (c, k) => Array.isArray(c.tyres_low) ? c.tyres_low.includes(k) : c.tyres && c.tyres[k] != null && c.tyres[k] < 2.2;
const speedCol = v => v < 70 ? C.ac : v < 95 ? C.wa : C.bad;
const pad2 = n => String(n).padStart(2, '0');

function sunUp(lat, lon, d = new Date()) {
  const r = Math.PI / 180;
  const day = (Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5;
  const decl = -23.44 * Math.cos(r * 360 / 365 * (day + 10));
  const ha = (d.getUTCHours() + d.getUTCMinutes() / 60 - 12) * 15 + lon;
  const el = Math.asin(Math.sin(lat * r) * Math.sin(decl * r) + Math.cos(lat * r) * Math.cos(decl * r) * Math.cos(ha * r)) / r;
  return el > -4;
}

// ---------- Piezas gráficas ----------
function arcPath(cx, cy, rad, a0, a1) {
  const p = a => [cx + rad * Math.cos(a * Math.PI / 180), cy + rad * Math.sin(a * Math.PI / 180)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${rad} ${rad} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
}
function fuelArc(pct) {
  const f = Math.max(0, Math.min(1, (pct || 0) / 100));
  const len = 54 * Math.PI * 1.5;
  const col = pct < 15 ? C.bad : C.ac;
  return `<svg width="112" height="112" viewBox="0 0 132 132" role="img" aria-label="Depósito al ${nf(pct)} %">

const PREP_ITEMS = ['Casco (y guantes si quieres)', 'Vaciar maletero y quitar objetos sueltos', 'Quitar la alfombrilla del conductor', 'Gancho de remolque puesto o a mano', 'Manómetro y llave dinamométrica', 'Compresor o inflador', 'Agua, comida y gorra', 'DNI, carné y reserva/pago de la tanda', 'Cinta para el número / dorsal si lo piden'];
function prepChecks() { try { return JSON.parse(localStorage.getItem('fst_prep') || '{}'); } catch (e) { return {}; } }
function trackPrepCard() {

// ---------- Salud y uso del motor (últimos 30 días) ----------
const GEAR_COL = ['#7d858f', '#4aa3ff', '#2ee59d', '#c9d45a', '#ffd400', '#ffb21e', '#ff4d3d'];
function hbars(items, total, col) {
  return items.map(it => { const p = total ? it.n / total * 100 : 0; return `<div style="display:grid;grid-template-columns:92px 1fr 40px;align-items:center;gap:8px;font-size:12px">
    <span class="m" style="color:#b3bac2">${esc(it.label)}</span><div style="height:12px;border-radius:3px;background:#1d2126;overflow:hidden"><div style="height:100%;width:${p.toFixed(1)}%;background:${typeof col === 'function' ? col(it) : col}"></div></div><span class="m" style="text-align:right;font-weight:700">${Math.round(p)} %</span></div>`; }).join('');
}
function scatterSvg(e) {
  const W = 340, H = 220, L0 = 34, B = 22, T = 8, R = 6, xmax = 200, ymax = 6500;
  const x = v => L0 + v / xmax * (W - L0 - R), y = v => T + (1 - v / ymax) * (H - T - B);
  let g = '';
  for (const v of [0, 2000, 4000, 6000]) g += `<line x1="${L0}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#1d2126"/><text x="${L0 - 5}" y="${y(v) + 4}" text-anchor="end" fill="#7d858f" font-size="10">${v / 1000}k</text>`;
  for (const v of [0, 50, 100, 150, 200]) g += `<text x="${x(v)}" y="${H - 6}" text-anchor="middle" fill="#7d858f" font-size="10">${v}</text>`;
  (e.gear_ratios || []).forEach((r, i) => {
    const vEnd = Math.min(xmax, r * ymax / 1000);
    g += `<line x1="${x(0)}" y1="${y(0)}" x2="${x(vEnd)}" y2="${y(vEnd / r * 1000)}" stroke="${GEAR_COL[i + 1]}" stroke-width="1" opacity=".45" stroke-dasharray="3 4"/>`;
    const lx = Math.min(xmax - 8, r * 6.1), ly = lx / r * 1000;
    g += `<text x="${x(lx)}" y="${y(ly) - 4}" fill="${GEAR_COL[i + 1]}" font-size="10" font-weight="700">${i + 1}ª</text>`;
  });
  for (const [s, r, gr] of e.scatter) g += `<circle cx="${x(s).toFixed(1)}" cy="${y(r).toFixed(1)}" r="2.6" fill="${GEAR_COL[gr] || GEAR_COL[0]}" opacity=".85"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Velocidad frente a revoluciones, con las líneas de cada marcha">${g}<text x="${W - R}" y="${H - 6 - 12}" text-anchor="end" fill="#7d858f" font-size="9">km/h</text></svg>`;
}
function warmSvg(list) {
  if (!list.length) return '<p class="muted">Aún no hay trayectos.</p>';
  const W = 340, H = 120, L0 = 26, B = 18, T = 6, n = list.length, bw = (W - L0) / n, max = Math.max(15, ...list.map(w => w.min || 0));
  const y = v => T + (1 - v / max) * (H - T - B);
  let g = [0, Math.round(max / 2), max].map(v => `<line x1="${L0}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#1d2126"/><text x="${L0 - 4}" y="${y(v) + 4}" text-anchor="end" fill="#7d858f" font-size="10">${v}</text>`).join('');
  list.forEach((w, i) => {
    const cx = L0 + i * bw + bw / 2;
    if (w.reached && w.min != null) g += `<rect x="${(cx - bw * .3).toFixed(1)}" y="${y(w.min).toFixed(1)}" width="${(bw * .6).toFixed(1)}" height="${(H - B - y(w.min)).toFixed(1)}" rx="2" fill="${w.min <= 8 ? C.ok : w.min <= 14 ? C.wa : C.bad}"/>`;
    else g += `<text x="${cx}" y="${H - B - 4}" text-anchor="middle" fill="${C.blue}" font-size="11" font-weight="700">✕</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Minutos hasta coger temperatura en cada trayecto">${g}<text x="${W}" y="${H - 4}" text-anchor="end" fill="#7d858f" font-size="9">min hasta temperatura · ✕ no llegó</text></svg>`;
}
function engineSections() {
  const e = engine;
  if (!e) return '<div class="pn pad"><p class="muted">Cargando salud del motor…</p></div>';
  if (!e.trips) return '<div class="pn pad"><p class="muted">Aún no hay trayectos en los últimos 30 días para analizar el motor.</p></div>';
  const sc = e.score, scol = sc >= 85 ? C.ok : sc >= 65 ? C.wa : C.bad;
  const ic = { ok: ['✓', C.ok], w: ['⚠︎', C.wa], x: ['⛔', C.bad] };
  const totR = e.rpm_bands.reduce((a, b) => a + b.n, 0), totG = e.gears.reduce((a, b) => a + b.n, 0);
  const r = e.records;
  const rec = (k, v, u, col) => `<div class="pn col" style="padding:12px;gap:4px;border-radius:12px"><span class="k">${k}</span><span class="m" style="font-size:20px;font-weight:700;${col ? 'color:' + col : ''}">${v}<span style="font-size:11px;color:#7d858f;font-weight:500"> ${u}</span></span></div>`;
  return `
  <div class="pn pad col" style="gap:12px">
    <div class="row"><span class="k">Cuidado del motor · 30 días</span><span style="font-size:12px;color:#7d858f">${e.trips} trayectos</span></div>
    <div style="display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center">
      <div style="width:84px;height:84px;border-radius:50%;background:conic-gradient(${scol} ${sc * 3.6}deg,#1d2126 0);display:grid;place-items:center"><div style="width:68px;height:68px;border-radius:50%;background:var(--pn,#111316);display:grid;place-items:center"><span class="m" style="font-size:26px;font-weight:700;color:${scol}">${sc}</span></div></div>
      <div class="col" style="gap:7px">${e.tips.map(t => `<div style="display:grid;grid-template-columns:16px 1fr;gap:6px;font-size:13px;line-height:1.35"><span style="color:${ic[t.k][1]};font-weight:700">${ic[t.k][0]}</span><span>${esc(t.t)}</span></div>`).join('')}</div>
    </div>
  </div>
  <div class="pn pad col" style="gap:8px">
    <span class="k">Tiempo en cada franja de vueltas</span>
    ${hbars(e.rpm_bands, totR, it => ({ 'Ralentí': C.mu, '1.100–2.000': C.blue, '2.000–2.500': '#2ee59d', '2.500–3.000': '#c9d45a', '3.000–4.000': C.ac, '4.000–5.000': C.wa, '+5.000': C.bad })[it.label] || C.ac)}
    <span class="k" style="padding-top:8px">Marcha que llevas</span>
    ${totG ? hbars(e.gears.map(g => ({ label: g.gear + 'ª', n: g.n, gear: g.gear })), totG, it => GEAR_COL[it.gear]) : '<p class="muted">Aún sin datos de marchas.</p>'}
    <span class="muted" style="font-size:11px">Sobre ${nf(e.samples)} lecturas en marcha (el coche manda una cada ~2 min). La marcha se calcula con la velocidad y las vueltas.</span>
  </div>
  <div class="pn pad col" style="gap:6px">
    <span class="k">Velocidad y vueltas · con las marchas</span>
    ${scatterSvg(e)}
    <span class="muted" style="font-size:11px">Cada punto es una lectura. Las líneas son tus 6 marchas (calibradas con tu coche). Los puntos fuera de las líneas son embrague pisado o cambiando.</span>

  <div class="pn pad col" style="gap:6px">
    <span class="k">Calentamiento por trayecto</span>
    ${warmSvg(e.warm)}
    ${e.max_temp_trips.some(t => t.t >= 108) ? `<span style="font-size:12px;color:${C.bad}">⛔ Algún trayecto pasó de 108 °C.</span>` : `<span class="muted" style="font-size:12px">Temperatura máxima en estos trayectos: ${nf(Math.max(...e.max_temp_trips.map(t => t.t)))} °C (normal hasta ~105).</span>`}
  </div>
  <div class="pn pad col" style="gap:10px"><div class="row"><span class="k">Batería · mínimo diario parado</span>${trendTag(battery)}</div>
    ${batteryBars(battery && battery.days)}
    <p class="muted">Por debajo de 12,2 V (línea roja) la batería sufre. Si baja día a día con el coche parado, revísala antes de que no arranque.</p></div>
  <div class="pn pad col" style="gap:6px">
    <div class="row"><span class="k">Alternador · tensión en marcha</span>${e.alt_avg != null ? `<span class="m" style="font-weight:700;color:${e.alt_avg >= 13.5 ? C.ok : C.wa}">${nf(e.alt_avg, 2)} V</span>` : ''}</div>
    ${e.alternator.length >= 2 ? lineChart(e.alternator, 'v', { min: 12.5, max: 15, fmt: v => nf(v, 1), color: C.blue, label: 'Tensión media en marcha por trayecto' }) : '<p class="muted">Hacen falta un par de trayectos más.</p>'}
    <span class="muted" style="font-size:11px">Normal entre 13,8 y 14,7 V. Si va bajando por debajo de 13,5 V, revisa alternador y batería.</span>
  </div>
  <div class="pn pad col" style="gap:6px">
    <div class="row"><span class="k">Vida del aceite</span>${e.oil.length ? `<span class="m" style="font-weight:700">${nf(e.oil[e.oil.length - 1].pct)} %</span>` : ''}</div>
    ${e.oil.length >= 2 ? lineChart(e.oil, 'pct', { min: 0, max: 100, fmt: v => nf(v), color: C.ok, label: 'Vida del aceite' }) : ''}
    <span class="muted" style="font-size:12px">${e.oil_eta ? `Al ritmo actual baja un 1 % cada ${nf(e.oil_rate)} km: cambio en unos ${nf(e.oil_eta.km)} km (≈ ${new Date(e.oil_eta.date).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })}).` : 'La fecha del cambio sale cuando el % baje un par de puntos más.'}</span>

  <div class="g3">
    ${rec('Rpm máx.', r.max_rpm != null ? nf(r.max_rpm) : '—', 'rpm', C.ac)}
    ${rec('Temp. máx.', r.max_temp != null ? nf(r.max_temp) : '—', '°C')}
    ${rec('+4.000 rpm', nf(r.over4000_min), 'min')}
    ${rec('Crucero 120', r.cruise_rpm != null ? nf(r.cruise_rpm) : '—', 'rpm')}
    ${rec('Arranques frío', nf(r.cold_starts_month), 'este mes')}
    ${rec('Sin calentar', r.short_pct != null ? nf(r.short_pct) : '—', '% tray.', r.short_pct > 25 ? C.wa : null)}
  </div>`;
}

function viewViajes() {
  if (tripDetail) return viewTrip(tripDetail);
  if (!trips) return '<div class="pn pad"><p class="muted">Cargando trayectos…</p></div>';
  if (!trips.length) return '<div class="pn pad"><p class="muted">Todavía no hay trayectos. Aparecerán cuando muevas el coche.</p></div>';

  const km = wk.reduce((s, t) => s + t.km, 0), secs = wk.reduce((s, t) => s + t.duration_s, 0), top = Math.max(0, ...wk.map(t => t.max_speed));
  const rec = (label, t, val, unit) => t ? `<button class="pn col" data-trip="${t.id}" style="padding:12px 14px;gap:4px;text-align:left"><span class="k">${label}</span><span class="m" style="font-size:24px;font-weight:700;color:${C.ac}">${val} <span style="font-size:12px;color:#7d858f;font-weight:500">${unit}</span></span><span style="font-size:11px;color:#7d858f">${esc(dayLabel(t.start_ts))} · #${pad2(t.id)}</span></button>` : '';

  const ms = monthSum, pv = (ms && ms.prev) || {};
  const dd = (x, y, inv) => x == null || !y ? '' : (() => { const q = Math.round((x - y) / y * 100); const good = inv ? q < 0 : q > 0; return ` <span style="font-size:11px;color:${q === 0 ? C.mu : good ? C.ok : C.wa}">${q > 0 ? '+' : ''}${q} %</span>`; })();
  const isMonth = viajesPeriod === 'mes' && ms;
  let html = `<div class="pn pad col" style="gap:10px">
    <div class="seg-pick" role="group" aria-label="Periodo"><button type="button" data-period="semana" class="${!isMonth ? 'on' : ''}">7 días</button><button type="button" data-period="mes" class="${isMonth ? 'on' : ''}">${ms ? esc(ms.label.split(' ')[0][0].toUpperCase() + ms.label.split(' ')[0].slice(1)) : 'Mes'}</button></div>
    ${isMonth ? `<div class="g3" style="gap:8px">
        <div class="col" style="gap:2px"><span class="k">Km</span><span class="m" style="font-size:22px;font-weight:700">${nf(ms.km)}${dd(ms.km, pv.km)}</span></div>
        <div class="col" style="gap:2px"><span class="k">Gasolina</span><span class="m" style="font-size:22px;font-weight:700">${nf(ms.fuel_eur, 0)} €${dd(ms.fuel_eur, pv.fuel_eur, true)}</span></div>
        <div class="col" style="gap:2px"><span class="k">Consumo</span><span class="m" style="font-size:22px;font-weight:700">${ms.l100 != null ? nf(ms.l100, 1) : '—'}${dd(ms.l100, pv.l100, true)}</span></div>
      </div>
      <span class="muted" style="font-size:12px">${ms.trips} trayectos · ${nf(ms.hours, 1)} h al volante${ms.work ? ` · al trabajo ${ms.work.trips} viajes, ${nf(ms.work.eur, 2)} €` : ''}${ms.other_eur ? ` · otros gastos ${nf(ms.other_eur, 2)} €` : ''}. Comparado con ${esc((pv.label || '').split(' ')[0])}. El día 1 te llega el resumen.</span>`
    : `<div class="g3" style="gap:8px">
        <div class="col" style="gap:2px"><span class="k">Km</span><span class="m" style="font-size:22px;font-weight:700">${nf(km)}</span></div>
        <div class="col" style="gap:2px"><span class="k">Al volante</span><span class="m" style="font-size:22px;font-weight:700">${clock(secs)}</span></div>
        <div class="col" style="gap:2px"><span class="k">Coste</span><span class="m" style="font-size:22px;font-weight:700">${nf(wk.reduce((s, t) => s + (t.cost_eur || 0), 0), 0)} €</span></div>
      </div><span class="muted" style="font-size:12px">${wk.length} trayectos en los últimos 7 días.</span>`}
  </div>`;

      <div class="g3" style="gap:8px">
        <div class="col" style="gap:2px"><span class="k">Punta</span><span class="m" style="font-size:20px;font-weight:700;color:${C.ac}">${nf(ci.top_speed)}</span></div>
        <div class="col" style="gap:2px"><span class="k">Rpm máx.</span><span class="m" style="font-size:20px;font-weight:700">${nf(ci.top_rpm)}</span></div>
        <div class="col" style="gap:2px"><span class="k">En pista</span><span class="m" style="font-size:20px;font-weight:700">${nf(ci.km)} km</span></div>
      </div></div>`).join('');
  if (commute && commute.length) html += commute.slice(0, 2).map(c => `<div class="pn pad col" style="gap:10px">
    <div class="row"><span class="k">${esc(c.route)}</span><span style="font-size:12px;color:#7d858f">${c.count} trayecto${c.count > 1 ? 's' : ''}</span></div>
    <div class="g3" style="gap:8px">
      <div class="col" style="gap:2px"><span class="k">Media</span><span class="m" style="font-size:20px;font-weight:700">${nf(c.avg_min)} <span style="font-size:12px;color:#7d858f">min</span></span></div>
      <div class="col" style="gap:2px"><span class="k">Mejor</span><span class="m" style="font-size:20px;font-weight:700;color:${C.ac}">${nf(c.best_min)} <span style="font-size:12px;color:#7d858f">min</span></span></div>
      <div class="col" style="gap:2px"><span class="k">Coste</span><span class="m" style="font-size:20px;font-weight:700">${c.avg_cost != null ? nf(c.avg_cost, 2) : '—'} <span style="font-size:12px;color:#7d858f">€</span></span></div>
    </div></div>`).join('');
  if (trackdays && trackdays.length) html += `<div class="k" style="padding:6px 2px 0">Días de circuito</div>` + trackdays.map((d, i) => `
    <div class="pn pad col" style="gap:10px">
      <div class="row"><span style="font-size:15px;font-weight:600">${esc(d.circuit)}</span><span style="font-size:12px;color:#7d858f">${new Date(d.day).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' })}</span></div>
      <div class="g3" style="gap:8px">
        <div class="col" style="gap:2px"><span class="k">En pista</span><span class="m" style="font-size:18px;font-weight:700">${nf(d.km, 1)} km</span></div>
        <div class="col" style="gap:2px"><span class="k">Punta</span><span class="m" style="font-size:18px;font-weight:700;color:${C.ac}">${nf(d.top_speed)}</span></div>
        <div class="col" style="gap:2px"><span class="k">Motor máx.</span><span class="m" style="font-size:18px;font-weight:700">${d.top_temp ? nf(d.top_temp) + '°' : '—'}</span></div>
        <div class="col" style="gap:2px"><span class="k">Tandas</span><span class="m" style="font-size:18px;font-weight:700">${d.sessions}</span></div>
        <div class="col" style="gap:2px"><span class="k">Gasolina</span><span class="m" style="font-size:18px;font-weight:700">${d.fuel_l != null ? nf(d.fuel_l, 1) + ' L' : '—'}</span></div>
        <div class="col" style="gap:2px"><span class="k">Coste</span><span class="m" style="font-size:18px;font-weight:700">${d.cost_eur != null ? nf(d.cost_eur, 2) + ' €' : '—'}</span></div>
      </div>
      ${d.note ? `<p style="margin:0;font-size:14px;white-space:pre-wrap;color:#c9ced4">${esc(d.note)}</p>` : ''}
      <button class="btn sec" data-tracknote="${i}">${d.note ? 'Editar notas' : 'Añadir notas (presiones, reglajes…)'}</button>
    </div>`).join('');
  // Lista: filtros y solo las 2 últimas semanas salvo que pidas más
  const isWork = t => /trabajo|oficina/i.test((t.from || '') + ' ' + (t.to || ''));
  const kind = t => t.track ? 'circuito' : isWork(t) ? 'trabajo' : 'otros';
  const counts = { todos: trips.length, trabajo: 0, circuito: 0, otros: 0 };
  trips.forEach(t => counts[kind(t)]++);
  const filtered = trips.filter(t => tripFilter === 'todos' || kind(t) === tripFilter);
  const cut = Date.now() - 14 * 86400e3;
  const shown = tripsAll ? filtered : filtered.filter((t, i) => t.start_ts >= cut || i < 5);
  html += `<div class="row" style="gap:6px;padding:6px 0 0;flex-wrap:wrap;justify-content:flex-start">${[['todos', 'Todos'], ['trabajo', 'Trabajo'], ['circuito', 'Circuito'], ['otros', 'Otros']].filter(([k]) => k === 'todos' || counts[k])
    .map(([k, l]) => `<button class="tag" data-tfilter="${k}" style="min-height:34px;padding:0 12px;font-size:12px;${tripFilter === k ? `color:#0a0b0d;background:${C.ac};border-color:${C.ac}` : 'color:#c9ced4;background:none'}">${l} · ${counts[k]}</button>`).join('')}</div>`;
  let day = null, group = '';
  const flush = () => { if (day) html += `<div class="pn" style="padding:4px 16px"><div class="k" style="padding:12px 0 4px">${esc(day)}</div>${group}</div>`; };
  for (const t of shown) {
    const d = dayLabel(t.start_ts);
    if (d !== day) { flush(); day = d; group = ''; }
    group += `<button class="li" data-trip="${t.id}" style="grid-template-columns:34px 1fr 92px">
      <span class="m" style="font-size:13px;color:#7d858f;font-weight:600">#${pad2(t.id)}</span>
      <span class="col" style="gap:2px"><span class="m" style="font-size:16px;font-weight:600">${t.from || t.to ? `${esc(t.from || '…')} → ${esc(t.to || '…')} <span style="font-size:12px;color:#7d858f;font-weight:500">${hm(t.start_ts)}</span>` : `${hm(t.start_ts)} → ${hm(t.end_ts)}`}${t.track ? ` <span class="tag" style="color:${C.ac};border-color:#4a4210;font-size:10px">${t.circuit ? '🏁 ' + esc(t.circuit.replace('Circuito de ', '')) : 'Circuito'}</span>` : ''}</span><span style="font-size:12px;color:#7d858f">Media ${nf(t.avg_speed)}${t.max_speed != null ? ' · máx. ' + nf(t.max_speed) : ''}${t.cost_eur != null ? ' · ' + nf(t.cost_eur, 2) + ' €' : ''}</span></span>
      <span class="col" style="gap:4px;align-items:flex-end"><span class="m" style="font-size:18px;font-weight:700">${nf(t.km, 1)} km</span>${spark(t.spark)}</span>
    </button>`;
  }
  flush();
  if (!shown.length) html += '<div class="pn pad"><p class="muted">No hay trayectos de este tipo.</p></div>';
  if (shown.length < filtered.length) html += `<button class="btn sec" data-tmore>Ver más (${filtered.length - shown.length})</button>`;
  return html;
}

function viewTrip(t) {
  const l100 = t.km > 1 && t.fuel_used_l ? t.fuel_used_l / t.km * 100 : null;
  const pts = (t.points || []).map(p => ({ ts: p[3], s: p[2] }));
  const trow = (label, val, unit = '', hi) => `<div class="row" style="padding:10px 0;border-top:1px solid #1b1e22;align-items:baseline"><span class="k">${label}</span><span class="m" style="font-size:20px;font-weight:700;${hi ? 'color:' + C.ac : ''}">${val} <span style="font-size:12px;color:#7d858f;font-weight:500">${unit}</span></span></div>`;
  let cmp = '';
  if (t.route) {
    const diff = t.duration_s - t.route.avg_duration_s, same = Math.abs(diff) < 30, faster = diff < 0;
    cmp = `<div class="pn pad col" style="gap:8px">
      <span class="k">Este recorrido · ${t.route.count + 1} veces</span>
      <div class="row" style="align-items:baseline"><span style="font-size:15px">${same ? 'En tu media de siempre' : faster ? 'Más rápido que tu media' : 'Más lento que tu media'}</span>
        <span class="m" style="font-size:24px;font-weight:700;color:${same ? C.tx : faster ? C.ok : C.wa}">${same ? '=' : (faster ? '−' : '+') + clock(Math.abs(diff))}</span></div>
      <div class="g3" style="gap:8px">
        <div class="col" style="gap:2px"><span class="k">Media</span><span class="m" style="font-size:16px;font-weight:600">${clock(t.route.avg_duration_s)}</span></div>
        <div class="col" style="gap:2px"><span class="k">Mejor</span><span class="m" style="font-size:16px;font-weight:600">${clock(Math.min(t.route.best_duration_s, t.duration_s))}</span></div>
        <div class="col" style="gap:2px"><span class="k">Coste medio</span><span class="m" style="font-size:16px;font-weight:600">${t.route.avg_cost_eur != null ? nf(t.route.avg_cost_eur, 2) + ' €' : '—'}</span></div>
      </div></div>`;
  }
  const st = t.stats, ser = (t.series || []).filter(p => p.ts);
  const chart = (title, key, o) => ser.filter(p => p[key] != null).length > 2 ? `<div class="pn pad col" style="gap:8px"><span class="k">${title}</span>${lineChart(ser.filter(p => p[key] != null), key, { dayTicks: false, label: title, ...o })}</div>` : '';
  const gearTotal = st && st.gears ? Object.values(st.gears).reduce((a, b) => a + b, 0) : 0;
  const gears = gearTotal ? `<div class="pn pad col" style="gap:10px"><span class="k">Marchas (calculadas por velocidad y rpm)</span>
    <div style="display:flex;gap:6px;align-items:flex-end;height:70px">${[1, 2, 3, 4, 5, 6].map(g => { const n = st.gears[g] || 0, pc = n / gearTotal; return `<div class="col" style="flex:1;align-items:center;gap:4px"><div style="width:100%;height:${Math.max(3, pc * 54)}px;background:${g === 6 ? C.ac : '#3a4048'};border-radius:4px"></div><span class="m" style="font-size:12px;color:#7d858f">${g}ª</span></div>`; }).join('')}</div></div>` : '';
  const tyre = st && st.tyre_rise && (st.tyre_rise.front || st.tyre_rise.rear) ? `<div class="pn pad col" style="gap:8px"><span class="k">Presiones al calentarse</span>
    <div class="row"><span>Delante</span><span class="m" style="font-weight:700">${nf(st.tyre_rise.from[0], 2)} → ${nf(st.tyre_rise.to[0], 2)} <span style="color:${C.ac}">(${st.tyre_rise.front >= 0 ? '+' : ''}${nf(st.tyre_rise.front, 2)})</span></span></div>
    <div class="row"><span>Detrás</span><span class="m" style="font-weight:700">${nf(st.tyre_rise.from[1], 2)} → ${nf(st.tyre_rise.to[1], 2)} <span style="color:${C.ac}">(${st.tyre_rise.rear >= 0 ? '+' : ''}${nf(st.tyre_rise.rear, 2)})</span></span></div></div>` : '';
  return `
  ${t.circuit ? `<div class="pn pad row"><span class="k" style="color:${C.ac}">🏁 ${esc(t.circuit)}</span><span style="font-size:12px;color:#7d858f">Sesión en circuito</span></div>` : ''}
  <div class="pn" style="overflow:hidden;position:relative"><div id="tripMapHost" class="map"></div>
    <div class="m" style="position:absolute;left:10px;bottom:22px;z-index:500;display:flex;gap:10px;background:rgba(10,11,13,.85);border-radius:8px;padding:6px 10px;font-size:11px">
      ${t.max_speed == null || (t.path && t.path.sparse) ? `<span style="color:${C.ok}">● Salida</span><span style="color:#f4f5f6">● Llegada</span>${t.path ? `<span style="color:${C.ac}">┅ Ruta estimada</span>` : ''}` : `<span style="color:${C.ac}">● &lt;70</span><span style="color:${C.wa}">● 70–95</span><span style="color:${C.bad}">● &gt;95 km/h</span>`}</div></div>
  <div class="g2">${kv('Distancia', nf(t.km, 1), 'km')}${kv('Tiempo', clock(t.duration_s))}</div>
  ${t.same ? sameCard(t) : cmp}
  <div class="pn" style="padding:4px 16px">
    ${trow('Velocidad media', nf(t.avg_speed), 'km/h')}${trow('Velocidad punta', t.max_speed_low ? '—' : nf(t.max_speed), 'km/h', true)}
    ${trow('Régimen máximo', nf(t.max_rpm), 'rpm')}${st && st.cruise_rpm ? trow('Rpm a 110–125 km/h', nf(st.cruise_rpm), 'rpm') : ''}
    ${trow('Motor máximo', nf(t.max_oil), '°C')}${st && st.warm_min != null ? trow('A temperatura en', nf(st.warm_min), 'min') : ''}
    ${t.circuit || t.rpm_high_pct ? trow('Sobre 4.000 rpm', nf(t.rpm_high_pct), '%') : ''}
    ${st && st.highway_pct != null ? trow('Autovía · ciudad', nf(st.highway_pct) + ' · ' + nf(st.city_pct), '%') : ''}
    ${trow('Gasolina gastada', t.fuel_used_l != null ? nf(t.fuel_used_l, 1) : '—', 'L')}${trow('Consumo', l100 ? (t.km < 15 ? '≈' : '') + nf(l100, 1) : '—', 'l/100')}
    ${st && st.alternator_v ? trow('Batería en marcha', nf(st.alternator_v, 2), 'V') : ''}
    ${trow('Coste del trayecto', t.cost_eur != null ? nf(t.cost_eur, 2) : '—', '€', true)}
  </div>
  ${t.price_l ? `<p class="muted" style="padding:0 4px">Coste calculado con ${nf(t.price_l, 3)} €/L (tu último repostaje con precio, o la media de gasolineras cercanas).</p>` : ''}
  ${t.km < 15 && t.fuel_used_l ? `<p class="muted" style="padding:0 4px">En trayectos cortos el consumo es aproximado: el indicador de gasolina va a saltos de ~0,2 L. El dato fiable es el del depósito entero (en Datos).</p>` : ''}
  ${t.path && t.path.sparse && t.max_speed != null ? `<p class="muted" style="padding:0 4px">El coche mandó pocas lecturas en este trayecto (${t.points.length}), así que el mapa dibuja la ruta más probable por carretera y la velocidad punta no es fiable.</p>` : ''}
  ${t.max_speed == null ? `<p class="muted" style="padding:0 4px">El coche no mandó datos durante este trayecto, solo al arrancar y al apagar: ${t.path ? 'el mapa dibuja la ruta más probable por carretera' : 'el mapa une la salida y la llegada en línea recta'} y no hay velocidad ni rpm.</p>` : `<div class="pn pad col" style="gap:8px"><span class="k">Velocidad</span>${lineChart(pts, 's', { min: 0, max: Math.max(60, Math.ceil(t.max_speed / 20) * 20), fmt: v => nf(v), color: C.ac, dayTicks: false, label: 'Velocidad durante el trayecto' })}</div>
  ${chart('Revoluciones', 'rpm', { min: 0, max: Math.max(3000, Math.ceil((t.max_rpm || 0) / 1000) * 1000), fmt: v => nf(v), color: C.blue })}
  ${gears}
  ${chart('Temperatura del motor', 'temp', { min: 0, max: 120, fmt: v => nf(v) + '°', color: C.wa })}
  ${chart('Depósito', 'fuel', { min: 0, max: 100, fmt: v => nf(v) + '%', color: C.ok })}
  ${tyre}`}
  ${st && st.cold_revs ? `<div class="pn pad" style="border-color:${C.blue}55"><span style="font-size:14px;color:#c9ced4">❄️ Llegaste a <b>${nf(st.cold_revs.rpm)} rpm</b> con el motor a ${nf(st.cold_revs.temp)}°. Hasta los 70–80° mejor no pasar de 3.000.</span></div>` : ''}
  <div class="btns"><button class="btn sec" id="imgBtn">Compartir imagen</button><button class="btn sec" id="gpxBtn">Exportar GPX</button></div>`;
}

// ---------- Exportar trayecto ----------
async function shareBlob(blob, name, title) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function exportGpx(t) {
  if (!t) return;
  const pts = (t.points || []);
  const name = `${t.from || 'Salida'} → ${t.to || 'Llegada'} · ${new Date(t.start_ts).toLocaleDateString('es-ES')}`;
  const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Mi Garaje" xmlns="http://www.topografix.com/GPX/1/1">
<trk><name>${name.replace(/[<&>]/g, '')}</name><trkseg>
${pts.map(p => `<trkpt lat="${p[0]}" lon="${p[1]}">${p[3] ? `<time>${new Date(p[3]).toISOString()}</time>` : ''}${p[2] != null ? `<extensions><speed>${(p[2] / 3.6).toFixed(2)}</speed></extensions>` : ''}</trkpt>`).join('\n')}
</trkseg></trk></gpx>`;
  shareBlob(new Blob([gpx], { type: 'application/gpx+xml' }), `trayecto-${t.id}.gpx`, name);
}

// Imagen para compartir: mapa oscuro de OpenStreetMap con la ruta por carretera, título que cabe y datos
async function shareTripImage(t) {
  if (!t) return;
  flash('Preparando la imagen…');
  const W = 1080, H = 1350, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  g.fillStyle = '#0a0b0d'; g.fillRect(0, 0, W, H);
  const pts = (t.points || []).filter(p => p[0] != null);
  const legs = t.path && t.path.legs ? t.path.legs : null;
  // Segmentos a dibujar: por carretera si la hay; si no, entre lecturas
  const segs = legs ? legs.map(l => ({ c: l.c, s: l.s, dash: t.path.sparse })) : pts.slice(1).map((p, i) => ({ c: [[pts[i][0], pts[i][1]], [p[0], p[1]]], s: p[2] }));
  const all = segs.flatMap(s => s.c);
  const box = { x: 60, y: 300, w: W - 120, h: 640 };
  const col = v => v == null || t.max_speed == null ? '#ffd400' : v > 95 ? '#ff4d3d' : v >= 70 ? '#ffb21e' : '#ffd400';
  // Proyección Mercator: el zoom más grande en el que cabe la ruta con margen
  const mx = (lon, z) => (lon + 180) / 360 * 256 * 2 ** z;
  const my = (lat, z) => { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 256 * 2 ** z; };
  g.save(); g.beginPath(); g.roundRect ? g.roundRect(box.x, box.y, box.w, box.h, 28) : g.rect(box.x, box.y, box.w, box.h); g.clip();
  g.fillStyle = '#121418'; g.fillRect(box.x, box.y, box.w, box.h);
  if (all.length > 1) {
    const la = all.map(p => p[0]), lo = all.map(p => p[1]);
    const [minLa, maxLa, minLo, maxLo] = [Math.min(...la), Math.max(...la), Math.min(...lo), Math.max(...lo)];
    let z = 17;
    while (z > 3 && (mx(maxLo, z) - mx(minLo, z) > box.w - 160 || my(minLa, z) - my(maxLa, z) > box.h - 160)) z--;
    const cx = (mx(minLo, z) + mx(maxLo, z)) / 2, cy = (my(minLa, z) + my(maxLa, z)) / 2;
    const ox = box.x + box.w / 2 - cx, oy = box.y + box.h / 2 - cy;
    const P = p => [mx(p[1], z) + ox, my(p[0], z) + oy];
    // Teselas de OpenStreetMap (si no cargan, queda el fondo liso)
    try {
      const tx0 = Math.floor((cx - box.w / 2) / 256), tx1 = Math.floor((cx + box.w / 2) / 256), ty0 = Math.floor((cy - box.h / 2) / 256), ty1 = Math.floor((cy + box.h / 2) / 256);
      const off = document.createElement('canvas'); off.width = box.w; off.height = box.h;
      const og = off.getContext('2d');
      const jobs = [];
      for (let x = tx0; x <= tx1; x++) for (let y = ty0; y <= ty1; y++) jobs.push(new Promise(ok => {
        const im = new Image(); im.crossOrigin = 'anonymous';
        im.onload = () => { og.drawImage(im, x * 256 - (cx - box.w / 2), y * 256 - (cy - box.h / 2)); ok(true); };
        im.onerror = () => ok(false);
        im.src = `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
      }));
      const res = await Promise.race([Promise.all(jobs), new Promise(r => setTimeout(() => r(null), 8000))]);
      if (res && res.some(Boolean)) {
        // Modo oscuro como en la app: invertir, girar el tono y bajar el brillo
        const id = og.getImageData(0, 0, box.w, box.h), d = id.data;
        for (let i = 0; i < d.length; i += 4) {
          const r = 255 - d[i], gg = 255 - d[i + 1], b = 255 - d[i + 2];
          // rotación de tono 180° aproximada (intercambia azules/naranjas) y apagado
          const l = (r + gg + b) / 3;
          d[i] = (l * .55 + (255 - r) * .08) * .62; d[i + 1] = (l * .55 + (255 - gg) * .08) * .64; d[i + 2] = (l * .55 + (255 - b) * .08) * .70;
        }
        og.putImageData(id, 0, 0);
        g.drawImage(off, box.x, box.y);
      }
    } catch (e) { /* sin mapa de fondo */ }
    // Ruta: primero un borde oscuro y luego el color de cada tramo
    g.lineCap = 'round'; g.lineJoin = 'round';
    for (const pass of [0, 1]) for (const sg of segs) {
      g.beginPath(); sg.c.forEach((p, i) => { const [x, y] = P(p); i ? g.lineTo(x, y) : g.moveTo(x, y); });
      g.setLineDash(pass && sg.dash ? [4, 22] : []);
      g.strokeStyle = pass ? col(sg.s) : 'rgba(0,0,0,.65)'; g.lineWidth = pass ? 11 : 19; g.stroke();
    }
    g.setLineDash([]);
    const dot = (p, c) => { const [x, y] = P(p); g.fillStyle = c; g.beginPath(); g.arc(x, y, 17, 0, 7); g.fill(); g.strokeStyle = '#0a0b0d'; g.lineWidth = 6; g.stroke(); };
    dot(all[0], '#2ee59d'); dot(all[all.length - 1], '#f4f5f6');
  }
  g.restore();
  g.strokeStyle = '#23272d'; g.lineWidth = 2; g.beginPath(); g.roundRect ? g.roundRect(box.x, box.y, box.w, box.h, 28) : g.rect(box.x, box.y, box.w, box.h); g.stroke();
  g.fillStyle = 'rgba(10,11,13,.7)'; g.fillRect(box.x + box.w - 230, box.y + box.h - 34, 214, 24);
  g.fillStyle = '#9aa1a9'; g.font = '500 18px "Inter Tight", sans-serif'; g.textAlign = 'right'; g.fillText('© OpenStreetMap', box.x + box.w - 22, box.y + box.h - 16); g.textAlign = 'left';
  // Textos: el título se reduce hasta caber y, si hace falta, va en dos líneas
  const model = carCfg && carCfg.model ? carCfg.model.split('·')[0].trim() : 'Fiesta ST';
  g.fillStyle = '#ffd400'; g.font = '700 32px "Chakra Petch", monospace'; g.fillText(model.toUpperCase(), 60, 96);
  const from = (t.from || '').toUpperCase(), to = (t.to || '').toUpperCase();
  const maxW = W - 120;
  const fit = (txt, start, min) => { let fs = start; do { g.font = `700 ${fs}px "Chakra Petch", monospace`; if (g.measureText(txt).width <= maxW) return fs; fs -= 2; } while (fs > min); return fs; };
  g.fillStyle = '#f4f5f6';
  if (from || to) {
    const one = `${from || '…'} → ${to || '…'}`;
    const fs1 = fit(one, 66, 46);
    if (g.measureText(one).width <= maxW) { g.font = `700 ${fs1}px "Chakra Petch", monospace`; g.fillText(one, 60, 186); }
    else {
      const l1 = from || '…', l2 = '→ ' + (to || '…');
      const fs = Math.min(fit(l1, 58, 30), fit(l2, 58, 30));
      g.font = `700 ${fs}px "Chakra Petch", monospace`; g.fillText(l1, 60, 158); g.fillText(l2, 60, 158 + fs + 6);
    }
  } else { g.font = '700 66px "Chakra Petch", monospace'; g.fillText(`TRAYECTO #${t.id}`, 60, 186); }
  g.fillStyle = '#7d858f'; g.font = '500 30px "Inter Tight", sans-serif';
  g.fillText(new Date(t.start_ts).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }) + ` · ${hm(t.start_ts)} → ${hm(t.end_ts)}`, 60, 270);
  const l100 = t.km > 1 && t.fuel_used_l ? t.fuel_used_l / t.km * 100 : null;
  const stats = [['DISTANCIA', nf(t.km, 1) + ' km'], ['TIEMPO', t.duration_s < 3600 ? Math.round(t.duration_s / 60) + ' min' : Math.floor(t.duration_s / 3600) + ' h ' + String(Math.round(t.duration_s % 3600 / 60)).padStart(2, '0')], ['MEDIA', nf(t.avg_speed) + ' km/h'],
    ['PUNTA', t.max_speed != null && !t.max_speed_low ? nf(t.max_speed) + ' km/h' : '—'], ['CONSUMO', l100 ? (t.km < 15 ? '≈' : '') + nf(l100, 1) + ' l/100' : '—'], ['COSTE', t.cost_eur != null ? nf(t.cost_eur, 2) + ' €' : '—']];
  stats.forEach(([k, v], i) => {
    const x = 60 + (i % 3) * 330, y = 1020 + Math.floor(i / 3) * 140;
    g.fillStyle = '#7d858f'; g.font = '600 24px "Chakra Petch", monospace'; g.fillText(k, x, y);
    g.fillStyle = i === 3 ? '#ffd400' : '#f4f5f6'; g.font = '700 50px "Chakra Petch", monospace'; g.fillText(v, x, y + 60);
  });
  if (t.circuit) { g.fillStyle = '#ffd400'; g.font = '700 30px "Chakra Petch", monospace'; g.fillText('🏁 ' + t.circuit, 60, 1300); }
  let blob;
  try { blob = await new Promise((ok, ko) => cv.toBlob(b => b ? ok(b) : ko(), 'image/png')); }
  catch (e) { flash('No se ha podido crear la imagen'); return; }
  // iOS solo deja compartir justo después de un toque: se enseña la imagen con su botón
  sheet = { type: 'shareimg', blob, name: `trayecto-${t.id}.png`, url: URL.createObjectURL(blob) }; render();
}

function adviceBox() {
  const a = advice;
  if (!a) return '';
  if (!a.ready) return `<p class="muted">Cargando el histórico de precios de los últimos 3 meses para decirte cuándo conviene llenar (${a.days || 0} de 90 días)…</p>`;
  const col = { llena: C.ok, espera: C.wa, normal: C.mu }[a.verdict];
  const lab = { llena: 'Buen día para llenar', espera: 'Mejor esperar', normal: 'Precio normal' }[a.verdict];
  return `<div class="col" style="gap:6px;padding:10px 12px;border-radius:10px;background:#15181c;border-left:3px solid ${col}">
    <div class="row"><span style="font-weight:700;color:${col}">${lab}</span><span class="m" style="font-size:13px;color:${a.diff_cts <= 0 ? C.ok : C.wa}">${a.diff_cts > 0 ? '+' : ''}${nf(a.diff_cts, 1)} cts vs media</span></div>
    <span style="font-size:13px">${esc(a.short)}</span>
    <span class="muted" style="font-size:12px">Media 30 días ${nf(a.mean, 3)} · mín. ${nf(a.min, 3)} · máx. ${nf(a.max, 3)}${a.trend_cts != null ? ` · semana ${a.trend_cts > 0 ? '↑ +' : a.trend_cts < 0 ? '↓ ' : '= '}${nf(a.trend_cts, 1)} cts` : ''}${a.pattern ? ` · más barata los ${a.pattern.best}, más cara los ${a.pattern.worst}` : ''}</span>
  </div>`;
}

function sameCard(t) {
  const c = t.same;

  return `<div class="pn pad col" style="gap:10px">
    <div class="row"><span class="k">Comparado con ${c.n} trayecto${c.n > 1 ? 's' : ''} igual${c.n > 1 ? 'es' : ''}</span>${c.is_best ? `<span class="tag" style="color:${C.ac};border-color:${C.ac}55">🏆 Tu mejor tiempo</span>` : `<span style="font-size:12px;color:#7d858f">${c.rank}º de ${c.of}</span>`}</div>
    <div class="g3" style="gap:8px">
      <div class="col" style="gap:2px"><span class="k">Vs media</span><span class="m" style="font-size:20px;font-weight:700;color:${dcol}">${c.diff_s > 0 ? '+' : c.diff_s < 0 ? '−' : ''}${mm(Math.abs(c.diff_s))}</span></div>
      <div class="col" style="gap:2px"><span class="k">Media</span><span class="m" style="font-size:20px;font-weight:700">${mm(c.avg_s)}</span></div>

        : `<button class="col" data-trip="${c.best_id}" style="gap:2px;background:none;border:0;padding:0;text-align:left;color:inherit"><span class="k">Mejor ›</span><span class="m" style="font-size:20px;font-weight:700;color:${C.ac}">${mm(c.best_s)}</span></button>`}

}

      <div class="col" style="gap:2px"><span class="k">Coste real por km</span><span class="m" style="font-size:18px;font-weight:700">${e.eur_km ? nf(e.eur_km * 100, 1) + ' cént.' : '—'}</span></div>

function viewTaller() {
  if (!maint) return '<div class="pn pad"><p class="muted">Cargando mantenimiento…</p></div>';
  const col = { vencido: C.bad, pronto: C.wa, ok: C.ok, 'sin datos': C.mu };
  const lab = { vencido: 'Vencido', pronto: 'Pronto', ok: 'Al día', 'sin datos': 'Sin configurar' };
  const unset = maint.items.filter(i => i.status === 'sin datos' && !i.oil_life);
  const items = maint.items.filter(i => !unset.includes(i)).map(i => {
    const segs = Array.from({ length: 12 }, (_, k) => `<div style="height:10px;border-radius:2px;background:${i.status !== 'sin datos' && (k + 1) / 12 <= i.pct + 1e-9 ? col[i.status] : '#1d2126'}"></div>`).join('');
    const last = [i.last_km != null ? 'Último: ' + nf(i.last_km) + ' km' : '', i.last_date ? new Date(i.last_date).toLocaleDateString('es-ES') : '',
      i.interval_km ? 'cada ' + nf(i.interval_km) + ' km' : '', i.interval_months ? 'cada ' + i.interval_months + ' meses' : ''].filter(Boolean).join(' · ');
    return `<div class="pn pad col" style="gap:10px">

// ---------- Ruedas en gráfico: dibujo por zonas, presiones y observaciones ----------
const WHEEL = { fl: 'delantera izquierda', fr: 'delantera derecha', rl: 'trasera izquierda', rr: 'trasera derecha' };
const zoneMin = z => z == null ? null : typeof z === 'number' ? z : (v => v.length ? Math.min(...v) : null)([z.o, z.c, z.i].filter(v => v != null));
// Color continuo: rojo en 1,6 mm → amarillo → verde con el dibujo de nuevas (así se ven las diferencias entre zonas)
const mmCol = (v, nw = 7.1) => { if (v == null) return '#2a2f35'; const f = Math.max(0, Math.min(1, (v - 1.6) / (nw - 1.6))); return `hsl(${Math.round(f * 140)} 70% ${46 + f * 4}%)`; };
function wheelsSvg(c, L) {
  const W = 340, H = 340, tw = 90, th = 108, nw = (tyreSet && tyreSet.new_mm) || 7.1;
  const pos = { fl: [8, 52, 'L'], fr: [242, 52, 'R'], rl: [8, 200, 'L'], rr: [242, 200, 'R'] };
  const t = (c && c.tyres) || {}, ref = (c && c.tyre_ref) || {};
  let g = `<rect x="108" y="40" width="124" height="282" rx="44" fill="#16191d" stroke="#2a2f35"/>
    <rect x="126" y="96" width="88" height="58" rx="10" fill="#0e1012" stroke="#2a2f35"/><rect x="130" y="232" width="80" height="40" rx="10" fill="#0e1012" stroke="#2a2f35"/>
    <text x="170" y="30" text-anchor="middle" fill="#7d858f" font-size="10" letter-spacing="2">DELANTE</text>`;
  for (const k of ['fl', 'fr', 'rl', 'rr']) {
    const [x, y, side] = pos[k];
    const z = L ? L[k] : null;
    const zones = z == null ? { o: null, c: null, i: null } : typeof z === 'number' ? { o: null, c: z, i: null } : z;
    // de izquierda a derecha en pantalla: en las ruedas izquierdas el exterior va a la izquierda; en las derechas, a la derecha
    const order = side === 'L' ? ['o', 'c', 'i'] : ['i', 'c', 'o'];
    const bw = tw / 3;
    g += `<clipPath id="cp_${k}"><rect x="${x}" y="${y}" width="${tw}" height="${th}" rx="12"/></clipPath><g clip-path="url(#cp_${k})">`;
    order.forEach((zk, i) => { g += `<rect x="${x + i * bw}" y="${y}" width="${bw + 0.5}" height="${th}" fill="${mmCol(zones[zk], nw)}" opacity="${zones[zk] == null ? 1 : .85}"/>`; });
    // dibujo del neumático (más o menos): surcos longitudinales y laminillas en diagonal
    for (let i = 1; i < 3; i++) g += `<rect x="${x + i * bw - 2}" y="${y}" width="4" height="${th}" fill="#0a0b0d" opacity=".75"/>`;
    for (let yy = y - 20; yy < y + th; yy += 13) g += `<path d="M${x} ${yy + 10} l${bw - 3} -8 M${x + bw + 2} ${yy + 4} l${bw - 4} 8 M${x + 2 * bw + 2} ${yy + 12} l${bw - 3} -8" stroke="#0a0b0d" stroke-width="2.2" opacity=".55" fill="none"/>`;
    g += `</g><rect x="${x}" y="${y}" width="${tw}" height="${th}" rx="12" fill="none" stroke="#3a4048" stroke-width="1.5"/>`;
    order.forEach((zk, i) => { if (zones[zk] != null) g += `<rect x="${x + i * bw + 2}" y="${y + th / 2 - 9}" width="${bw - 4}" height="17" rx="4" fill="#0a0b0d" opacity=".78"/><text x="${x + i * bw + bw / 2}" y="${y + th / 2 + 4}" text-anchor="middle" fill="#f4f5f6" font-size="11" font-weight="700" font-family="var(--mono)">${nf(zones[zk], 1)}</text>`; });
    if (z == null) g += `<text x="${x + tw / 2}" y="${y + th / 2 + 4}" text-anchor="middle" fill="#7d858f" font-size="10">sin medir</text>`;
    // presión: encima de las delanteras, debajo de las traseras
    const v = t[k], r = ref[k], d = v != null && r != null ? v - r : null;
    const pc = v == null ? C.mu : (d != null ? d <= -0.12 : tyreLow(c, k)) || tyreLow(c, k) ? C.wa : d >= 0.15 ? C.blue : C.tx;
    const py = k[0] === 'f' ? y - 8 : y + th + 18;
    g += `<text x="${x + tw / 2}" y="${py}" text-anchor="middle" fill="${pc}" font-size="15" font-weight="700" font-family="var(--mono)">${v != null ? nf(v, 2) : '—'}<tspan font-size="10" fill="#7d858f"> bar</tspan></text>`;
    // ext/int bajo cada rueda delantera, para orientarse
    if (k === 'fl' || k === 'fr') g += `<text x="${x + 6}" y="${y + th + 12}" fill="#7d858f" font-size="8">${side === 'L' ? 'EXT' : 'INT'}</text><text x="${x + tw - 6}" y="${y + th + 12}" text-anchor="end" fill="#7d858f" font-size="8">${side === 'L' ? 'INT' : 'EXT'}</text>`;
  }

function wheelNotes(c, ts) {
  const out = [];
  const t = (c && c.tyres) || {}, ref = (c && c.tyre_ref) || {};
  const running = c && c.ignition && c.ignition !== 'off';
  const lastTrip = trips && trips[0] ? trips[0].end_ts : 0;
  const hot = running || (Date.now() - lastTrip < 45 * 60e3);
  const P = (k, v) => `${WHEEL[k]} ${nf(v, 2)} bar`;
  // En caliente se comparan las presiones en frío de hoy (las del arranque, con el motor frío)
  const cold = ts && ts.cold && ts.cold.ts && Date.now() - ts.cold.ts < 20 * 3600e3 ? ts.cold : null;
  const useCold = hot && cold;
  if (Object.keys(t).length) {
    if (useCold) out.push(['i', `En caliente suben 0,2-0,3 bar, así que comparo con las de hoy en frío (${hm(cold.ts)}): ${['fl', 'fr', 'rl', 'rr'].map(k => nf(cold[k], 2)).join(' · ')} bar.`]);
    else if (hot) out.push(['i', 'Presiones en caliente: al rodar suben 0,2-0,3 bar. Para compararlas con las tuyas, míralas en frío (por la mañana o tras 2-3 h parado).']);
    for (const k of ['fl', 'fr', 'rl', 'rr']) {
      const v = useCold ? cold[k] : t[k], r = ref[k]; if (v == null || r == null) continue;
      const d = v - r;
      if ((!hot || useCold) && d <= -0.12) out.push(['w', `${P(k, v)}: baja (${nf(d, 2)}). Ponla a ${nf(r, 2)}: con poca presión se gastan los dos hombros y se calienta más.`]);
      if ((!hot || useCold) && d >= 0.15) out.push(['b', `${P(k, v)}: algo inflada (+${nf(d, 2)}). Con mucha presión se gasta más el centro y agarra menos.`]);
    }
    for (const [a, b, n] of [['fl', 'fr', 'delanteras'], ['rl', 'rr', 'traseras']]) {
      const P2 = useCold ? cold : t;
      if (P2[a] != null && P2[b] != null && Math.abs(P2[a] - P2[b]) >= (hot && !useCold ? 0.15 : 0.1)) out.push(['w', `Las ${n} van distintas${useCold ? ' en frío' : ''} (${nf(P2[a], 2)} y ${nf(P2[b], 2)}): iguálalas, si no el coche tira hacia un lado al frenar.`]);
    }
  }
  const L = ts && ts.tread_last;
  if (L) {
    const m = k => zoneMin(L[k]);
    (ts.tread_notes || []).forEach(n => out.push(['w', n[0].toUpperCase() + n.slice(1) + '.']));
    const f = [m('fl'), m('fr')].filter(v => v != null), r = [m('rl'), m('rr')].filter(v => v != null);
    if (f.length && r.length) {
      const df = r.reduce((a, b) => a + b, 0) / r.length - f.reduce((a, b) => a + b, 0) / f.length;
      if (df >= 1.5) out.push(['w', `Las delanteras están ${nf(df, 1)} mm más gastadas que las traseras: permútalas ya, aunque no hayan pasado los 10.000 km. Con tanta diferencia el coche se descompensa y las delanteras se acaban antes.`]);
      else if (df >= 0.8) out.push(['i', `Las delanteras están ${nf(df, 1)} mm más gastadas que las traseras (normal en un tracción delantera). ${ts.rotate_in_km != null && ts.rotate_in_km <= 0 ? 'Toca permutar.' : ts.rotate_in_km != null ? `Permútalas en ${nf(ts.rotate_in_km)} km o cuando la diferencia llegue a 1,5 mm, lo que pase antes.` : 'Permútalas cuando la diferencia llegue a 1,5 mm.'}`]);
      else if (df <= -0.8) out.push(['w', `Las traseras están ${nf(-df, 1)} mm más gastadas que las delanteras: es raro en un tracción delantera. Revisa la alineación trasera.`]);
    }
    for (const [a, b] of [['fl', 'fr'], ['rl', 'rr']]) {
      if (m(a) != null && m(b) != null && Math.abs(m(a) - m(b)) >= 0.5) {
        const [w, o] = m(a) < m(b) ? [a, b] : [b, a];
        out.push(['w', `La ${WHEEL[w]} está ${nf(Math.abs(m(a) - m(b)), 1)} mm más gastada que la ${WHEEL[o]}: revisa presión y alineación de ese lado.`]);
      }
    }
    for (const k of ['fl', 'fr', 'rl', 'rr']) {
      const v = m(k); if (v == null) continue;
      if (v < 1.6) out.push(['x', `${WHEEL[k][0].toUpperCase() + WHEEL[k].slice(1)} por debajo de 1,6 mm: es ilegal y peligrosa. Cámbiala.`]);
      else if (v < 3) out.push(['w', `${WHEEL[k][0].toUpperCase() + WHEEL[k].slice(1)} a ${nf(v, 1)} mm: en mojado ya agarra bastante menos. Ve pensando en cambiarlas.`]);
    }
    const P0 = ts.tread_prev;
    if (P0) {
      const km = L.km - P0.km;
      const worst = ['fl', 'fr', 'rl', 'rr'].map(k => ({ k, d: zoneMin(P0[k]) != null && m(k) != null ? zoneMin(P0[k]) - m(k) : null })).filter(x => x.d != null).sort((a, b) => b.d - a.d)[0];
      if (worst && km > 500) out.push(['i', `Desde la medida anterior (${nf(km)} km) la que más ha gastado es la ${WHEEL[worst.k]}: ${nf(worst.d, 1)} mm.`]);
    }
  } else out.push(['i', 'Mide el dibujo (exterior, centro e interior de cada rueda) para ver cómo se gastan y comparar entre ellas.']);
  if (!out.some(o => o[0] === 'w' || o[0] === 'x' || o[0] === 'b')) out.push(['ok', L ? 'Todo en orden: presiones correctas y desgaste parejo.' : 'Presiones correctas.']);
  const ic = { i: ['ℹ︎', C.mu], w: ['⚠︎', C.wa], b: ['↑', C.blue], x: ['⛔', C.bad], ok: ['✓', C.ok] };
  return out.map(([k, txt]) => `<div style="display:grid;grid-template-columns:18px 1fr;gap:6px;font-size:13px;line-height:1.35"><span style="color:${ic[k][1]};font-weight:700">${ic[k][0]}</span><span>${esc(txt)}</span></div>`).join('');
}
